# CI — SPEC 117.66/117.67.
#
# The quality gate a change must pass before it can merge. Ordered cheapest
# first so an obvious failure reports in seconds rather than minutes.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run on the same ref; no point finishing a
# build for a commit nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # ci, not install: the lockfile is the source of truth for a build.
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Migrations apply from scratch
        # Catches a migration that only works against an already-populated
        # database — which is exactly the one that fails on a fresh deploy.
        run: |
          rm -rf .ci-db
          DATABASE_URL="pglite:.ci-db" npm run db:migrate
          DATABASE_URL="pglite:.ci-db" npm run db:seed
          rm -rf .ci-db

      - name: Admin panel builds
        run: node apps/admin/build.mjs

      - name: Compiles to runnable JavaScript
        # Production runs compiled output, not --experimental-strip-types, so
        # the emit itself must be verified — including that each entrypoint
        # actually starts.
        run: |
          npm run build
          for svc in api worker scheduler bot mini-app admin; do
            output=$(APP_ENV=development DATABASE_URL="pglite:.ci-dist" \
              CUBEPAY_SANDBOX=true TON_MOCK=true TELEGRAM_BOT_TOKEN=000:test \
              timeout 20 node --input-type=module \
              -e "await import('./dist/apps/$svc/src/main.js')" 2>&1 || true)
            if echo "$output" | grep -qE "Cannot find|SyntaxError|ERR_MODULE"; then
              echo "::error::dist/apps/$svc does not run"
              echo "$output" | head -20
              exit 1
            fi
          done
          rm -rf .ci-dist

      - name: Every service loads under bare Node
        # tsc and vitest both transpile, so neither catches TypeScript that
        # node --experimental-strip-types refuses (parameter properties, enums,
        # namespaces). Production runs bare Node, so this must be checked here.
        run: |
          for svc in api worker scheduler bot mini-app admin; do
            output=$(APP_ENV=development DATABASE_URL="pglite:.ci-load" \
              CUBEPAY_SANDBOX=true TON_MOCK=true TELEGRAM_BOT_TOKEN=000:test \
              timeout 20 node --experimental-strip-types --input-type=module \
              -e "await import('./apps/$svc/src/main.ts')" 2>&1 || true)
            if echo "$output" | grep -q 'ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX'; then
              echo "::error::apps/$svc does not load under --experimental-strip-types"
              echo "$output" | head -20
              exit 1
            fi
          done
          rm -rf .ci-load

  # The suite runs on PGlite, which is not PostgreSQL. Migrations, triggers,
  # partial indexes and window functions must be proven against the real
  # engine, and BullMQ against real Redis, or "green tests" prove less than
  # they appear to.
  real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gram
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gram
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gram -d gram"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Migrations against real PostgreSQL
        env:
          DATABASE_URL: postgres://gram:ci@127.0.0.1:5432/gram
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Migrations are idempotent
        # A re-run must be a no-op, not an error: deploys re-run them.
        env:
          DATABASE_URL: postgres://gram:ci@127.0.0.1:5432/gram
        run: npm run db:migrate

      - name: Integration tests against real PostgreSQL
        env:
          DATABASE_URL: postgres://gram:ci@127.0.0.1:5432/gram
          REDIS_URL: redis://127.0.0.1:6379
        run: npm test

  # Financial invariants that must never regress, asserted against the source
  # rather than at runtime. Cheap, and each one has cost a real system money
  # somewhere.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: No automated treasury funding (SPEC 3755)
        run: |
          if grep -rniE '(auto_buy|auto_fund|auto_swap|auto_exchange|auto_bridge)[^=]*=[^=]*true' \
               --include='*.ts' --include='*.sql' packages apps db scripts; then
            echo "::error::automated treasury funding is forbidden"
            exit 1
          fi

      - name: No floating point money
        run: |
          if grep -rnE '(REAL|DOUBLE PRECISION|FLOAT)' db/migrations/*.sql; then
            echo "::error::money columns must never be floating point"
            exit 1
          fi

      - name: Ledger posting stays behind post()
        run: |
          # Only the ledger service may write journal entries.
          offenders=$(grep -rln 'INSERT INTO finance.journal_entries' \
            --include='*.ts' packages apps | grep -v 'packages/ledger/src/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::journal entries may only be written by the ledger service: $offenders"
            exit 1
          fi

      - name: GRAM is native, not a jetton
        run: |
          # Comments explaining WHY GRAM is not a jetton are welcome; code that
          # treats it as one is not. Match identifiers and endpoints only.
          if grep -rnE 'jetton_(master|wallet|address)|jettonMaster|/jetton/' \
               --include='*.ts' --include='*.sql' packages apps db; then
            echo "::error::GRAM is TON's native currency; jetton handling is wrong"
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        # Advisory: a transitive advisory should surface without blocking an
        # unrelated fix from shipping.
        run: npm audit --audit-level=high || true

      - name: No committed secrets
        run: |
          if grep -rnE '(BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-|sk_live_)' \
               --include='*.ts' --include='*.sql' --include='*.json' --include='*.yml' \
               packages apps db scripts infra .github; then
            echo "::error::a credential appears to be committed"
            exit 1
          fi
